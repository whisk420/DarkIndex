name: Build Android APKs

on:
  workflow_dispatch: # Only runs when you manually click "Run workflow"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Grant Execute Permission to Gradlew
      run: chmod +x gradlew

    - name: Assemble Debug APKs
      run: ./gradlew assembleDebug --stacktrace

    - name: Prepare APKs
      run: |
        mkdir -p build-outputs
        cp app/build/outputs/apk/standalone/debug/app-standalone-debug.apk build-outputs/HackExHarvester-Standalone.apk
        cp app/build/outputs/apk/googlePlay/debug/app-googlePlay-debug.apk build-outputs/HackExHarvester-GooglePlay.apk

    - name: Upload Standalone APK
      uses: actions/upload-artifact@v4
      with:
        name: HackExHarvester-Standalone
        path: build-outputs/HackExHarvester-Standalone.apk
        retention-days: 14

    - name: Upload GooglePlay APK
      uses: actions/upload-artifact@v4
      with:
        name: HackExHarvester-GooglePlay
        path: build-outputs/HackExHarvester-GooglePlay.apk
        retention-days: 14
