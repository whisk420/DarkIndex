name: Build & Publish Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release Version Tag (e.g. 1.2 or v1.2)'
        required: false
        default: '1.2'
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Grant Execute Permission to Gradlew
      run: chmod +x gradlew

    - name: Determine Release Version & Code
      id: get_version
      run: |
        INPUT_VER="${{ inputs.version }}"
        REF_VER="${{ github.ref_name }}"
        
        if [ -n "$INPUT_VER" ]; then
          VER="$INPUT_VER"
        elif [[ "$REF_VER" == v* ]]; then
          VER="$REF_VER"
        else
          VER="1.2"
        fi
        
        # Strip leading 'v' for versionName
        CLEAN_VER="${VER#v}"
        
        # Tag name with 'v'
        TAG_VER="v$CLEAN_VER"
        
        echo "RELEASE_VERSION=$TAG_VER" >> $GITHUB_ENV
        echo "VERSION_NAME=$CLEAN_VER" >> $GITHUB_ENV
        echo "VERSION_CODE=${{ github.run_number }}" >> $GITHUB_ENV
        
        echo "Calculated Tag: $TAG_VER"
        echo "Calculated Version Name: $CLEAN_VER"
        echo "Calculated Version Code: ${{ github.run_number }}"

    - name: Assemble Release APK
      run: |
        ./gradlew assembleRelease \
          -PversionName="${{ env.VERSION_NAME }}" \
          -PversionCode="${{ env.VERSION_CODE }}" \
          --stacktrace

    - name: Prepare Release APK Artifact
      run: |
        mkdir -p build-outputs
        cp app/build/outputs/apk/release/app-release.apk build-outputs/DarkIndex.apk

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: DarkIndex-v${{ env.VERSION_NAME }}
        path: build-outputs/DarkIndex.apk
        retention-days: 14

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ env.RELEASE_VERSION }}
        name: "DarkIndex ${{ env.RELEASE_VERSION }}"
        body: |
          ### DarkIndex ${{ env.RELEASE_VERSION }}
          
          100% offline standalone release.
          
          - **`DarkIndex.apk`**: Single, 100% offline APK with zero internet permissions. Auto-mirrors database backups directly to your device's `Downloads/DarkIndex/` folder.
        files: |
          build-outputs/DarkIndex.apk
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
