name: Build & Publish Release

on:
  workflow_dispatch:
    inputs:
      release:
        description: 'Release type. Minor: 1.6.1 -> 1.6.2. Major: 1.6.5 -> 1.7.'
        type: choice
        options:
          - minor
          - major
        default: minor
      version:
        description: 'Exact version (optional, e.g. 2.0). Overrides the release type.'
        required: false
        default: ''
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  # Build provenance: lets anyone prove a release APK was built by this workflow from this repo's source.
  id-token: write
  attestations: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v5
      with:
        # Full history + tags: the version code is 1000 + commit count and the name bumps the latest v* tag.
        fetch-depth: 0
        fetch-tags: true

    - name: Set up JDK 17
      uses: actions/setup-java@v5
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Grant Execute Permission to Gradlew
      run: chmod +x gradlew

    # Every release MUST be signed with the one permanent DarkIndex key, otherwise Android forces an
    # uninstall (and data loss) when updating. Refuse to build if the secrets are missing.
    - name: Decode Permanent Signing Key
      env:
        SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
        SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
        SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
      run: |
        for name in SIGNING_KEYSTORE_BASE64 SIGNING_STORE_PASSWORD SIGNING_KEY_ALIAS SIGNING_KEY_PASSWORD; do
          if [ -z "${!name}" ]; then
            echo "::error::Missing repository secret $name — refusing to publish an APK signed with a throwaway key."
            exit 1
          fi
        done
        echo "$SIGNING_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/darkindex-release.jks"
        echo "SIGNING_STORE_FILE=$RUNNER_TEMP/darkindex-release.jks" >> "$GITHUB_ENV"

    - name: Determine Release Version & Code
      id: get_version
      run: |
        INPUT_VER="${{ inputs.version }}"
        REF_VER="${{ github.ref_name }}"

        if [ -n "$INPUT_VER" ]; then
          VER="$INPUT_VER"                       # typed in "Run workflow"
        elif [ "${{ github.ref_type }}" = "tag" ] && [[ "$REF_VER" == v* ]]; then
          VER="$REF_VER"                         # pushed a v* tag
        else
          # Automatic: bump the highest v* tag. Minor = last number (1.6.1 -> 1.6.2, 1.7 -> 1.7.1),
          # major = middle number, dropping the last (1.6.5 -> 1.7). No tags yet -> 1.0.
          LAST=$(git tag -l 'v*' | sort -V | tail -1)
          if [ -z "$LAST" ]; then
            VER="1.0"
          else
            IFS=. read -r MAJOR MINOR PATCH <<< "${LAST#v}"
            MINOR=${MINOR:-0}; PATCH=${PATCH:-0}
            if [ "${{ inputs.release }}" = "major" ]; then
              VER="$MAJOR.$((MINOR + 1))"
            else
              VER="$MAJOR.$MINOR.$((PATCH + 1))"
            fi
          fi
          echo "Latest tag: ${LAST:-none} -> ${{ inputs.release || 'minor' }} release $VER"
        fi

        CLEAN_VER="${VER#v}"                     # versionName without the v
        TAG_VER="v$CLEAN_VER"                    # release tag with the v

        # Same rule as app/build.gradle.kts, so CI and local builds of one commit share a code.
        COMMITS=$(git rev-list --count HEAD)
        CODE=$((1000 + COMMITS))

        if [ "${{ github.ref_type }}" != "tag" ] && git rev-parse -q --verify "refs/tags/$TAG_VER" >/dev/null; then
          echo "::error::Tag $TAG_VER already exists. Enter a different version, or leave it empty to auto-bump."
          exit 1
        fi

        echo "RELEASE_VERSION=$TAG_VER" >> $GITHUB_ENV
        echo "VERSION_NAME=$CLEAN_VER" >> $GITHUB_ENV
        echo "VERSION_CODE=$CODE" >> $GITHUB_ENV

        echo "Release tag:   $TAG_VER"
        echo "Version name:  $CLEAN_VER"
        echo "Version code:  $CODE (1000 + $COMMITS commits)"

    # Never publish a build whose unit tests fail.
    - name: Run Unit Tests
      run: ./gradlew testDebugUnitTest --stacktrace

    - name: Upload Test Report (on failure)
      if: failure()
      uses: actions/upload-artifact@v6
      with:
        name: unit-test-report
        path: app/build/reports/tests/testDebugUnitTest/
        retention-days: 14

    - name: Assemble Release APK
      env:
        SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
        SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
        SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
      run: |
        ./gradlew assembleRelease \
          -PversionName="${{ env.VERSION_NAME }}" \
          -PversionCode="${{ env.VERSION_CODE }}" \
          --stacktrace

    - name: Prepare Release APK Artifact
      run: |
        mkdir -p build-outputs
        cp app/build/outputs/apk/release/app-release.apk build-outputs/DarkIndex.apk

    # Prints the signing certificate so every release can be compared. If the repository
    # variable SIGNING_CERT_SHA256 is set, the build fails when the certificate doesn't match it.
    - name: Verify Signing Certificate
      env:
        EXPECTED_SHA256: ${{ vars.SIGNING_CERT_SHA256 }}
      run: |
        APKSIGNER="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)/apksigner"
        "$APKSIGNER" verify --print-certs build-outputs/DarkIndex.apk | tee certs.txt
        # Pull the 64-hex-char fingerprint out of the SHA-256 line, whatever apksigner's label format is
        ACTUAL=$(grep -m1 -i "SHA-256 digest" certs.txt | grep -oiE '[0-9a-f]{64}' | head -1 | tr 'A-F' 'a-f')
        if [ -z "$ACTUAL" ]; then
          echo "::error::Could not read the APK signing certificate SHA-256 (see apksigner output above)."
          exit 1
        fi
        echo "Signing certificate SHA-256: $ACTUAL"
        if [ -n "$EXPECTED_SHA256" ]; then
          EXPECTED=$(echo "$EXPECTED_SHA256" | tr -d ' :' | tr 'A-F' 'a-f')
          if [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "::error::APK is signed with an unexpected key ($ACTUAL), expected $EXPECTED."
            exit 1
          fi
          echo "Certificate matches SIGNING_CERT_SHA256 ✔"
        fi

    # Privacy guard on the real APK (merged manifest, including every library): no network permission,
    # no Android cloud backup. Fails the release if either ever changes.
    - name: Verify No Network Permission And No Cloud Backup
      run: |
        AAPT2="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)/aapt2"
        "$AAPT2" dump permissions build-outputs/DarkIndex.apk | tee permissions.txt
        if grep -E "android.permission.(INTERNET|ACCESS_NETWORK_STATE|ACCESS_WIFI_STATE)" permissions.txt; then
          echo "::error::The APK requests a network permission. DarkIndex must stay offline."
          exit 1
        fi
        "$AAPT2" dump xmltree build-outputs/DarkIndex.apk --file AndroidManifest.xml > manifest.txt
        if ! grep -qE 'android:allowBackup\(0x[0-9a-f]+\)=false' manifest.txt; then
          echo "::error::android:allowBackup is not false in the APK manifest."
          exit 1
        fi
        echo "No network permission, cloud backup off ✔"

    - name: APK Checksum
      run: |
        APK_SHA256=$(sha256sum build-outputs/DarkIndex.apk | cut -d' ' -f1)
        echo "APK SHA-256: $APK_SHA256"
        echo "APK_SHA256=$APK_SHA256" >> "$GITHUB_ENV"

    - name: Attest Build Provenance
      uses: actions/attest-build-provenance@v2
      with:
        subject-path: build-outputs/DarkIndex.apk

    - name: Remove Decoded Keystore
      if: always()
      run: rm -f "$RUNNER_TEMP/darkindex-release.jks"

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v6
      with:
        name: DarkIndex-v${{ env.VERSION_NAME }}
        path: build-outputs/DarkIndex.apk
        retention-days: 14

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v3
      with:
        tag_name: ${{ env.RELEASE_VERSION }}
        name: "DarkIndex ${{ env.RELEASE_VERSION }}"
        body: |
          ### DarkIndex ${{ env.RELEASE_VERSION }}

          - **`DarkIndex.apk`**: offline APK. No internet permission (checked on this APK by the release workflow), Android cloud backup off, reads only the HackEx 2 screen. Keeps a backup copy in your phone's `Downloads/DarkIndex/` folder. See [SECURITY.md](https://github.com/${{ github.repository }}/blob/${{ env.RELEASE_VERSION }}/SECURITY.md).
          - Signed with the permanent DarkIndex key: installs over previous releases and Android Studio builds without uninstalling.
          - Built by GitHub Actions from commit `${{ github.sha }}`, with a signed build-provenance attestation.
          - APK SHA-256: `${{ env.APK_SHA256 }}`. Verify: `gh attestation verify DarkIndex.apk --repo ${{ github.repository }}`
        files: |
          build-outputs/DarkIndex.apk
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
